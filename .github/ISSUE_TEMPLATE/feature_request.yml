name: Feature request
description: Suggest a change to Errata
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a publisher, editor or reader cannot do today, and why it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like Errata to do.
    validations:
      required: true
