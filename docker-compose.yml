name: errata

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: errata
      POSTGRES_PASSWORD: errata
      POSTGRES_DB: errata
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - errata-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errata -d errata"]
      interval: 2s
      timeout: 3s
      retries: 30

  runtime:
    build:
      context: .
      dockerfile: apps/runtime/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://errata:errata@db:5432/errata
      APP_BASE_URL: http://localhost:3000
      NODE_ENV: ${ERRATA_NODE_ENV:-development}
      RESUME_INTERRUPTED_ON_BOOT: "true"
    volumes:
      - errata-storage:/srv/storage
      - ${HOME}/.mozaik:/home/node/.mozaik:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        RUNTIME_INTERNAL_URL: http://runtime:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      runtime:
        condition: service_healthy

volumes:
  errata-db:
  errata-storage:
